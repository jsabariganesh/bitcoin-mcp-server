---
applications:
  - name: bitcoin-mcp-server
    buildpacks:
      - java_buildpack_offline
    memory: 1G
    instances: 1
    path: target/bitcoinn-mcp-server-0.0.1-SNAPSHOT.jar
    env:
      JBP_CONFIG_OPEN_JDK_JRE: '{ jre: { version: 21.+ } }'
      # Tanzu OTel Collector Metrics Configuration (disabled by default until collector endpoint configured)
      TANZU_METRICS_JVM_ENABLED: false
      TANZU_METRICS_CUSTOM_ENABLED: false
